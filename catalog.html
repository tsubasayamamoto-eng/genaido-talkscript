<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カタログ仕上げ｜Keepa→月販50カタログ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f4f5f7;color:#222}
header{position:sticky;top:0;background:#37474f;color:#fff;padding:14px 20px;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:18px}.sub{font-size:12px;opacity:.85;margin-top:3px}
.setup{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{flex:1;min-width:260px;border:2px dashed #90a4ae;border-radius:10px;padding:14px 16px;text-align:center;font-size:13px;color:#cfd8dc;cursor:pointer;background:rgba(255,255,255,.05);transition:.15s}
.drop.over{background:rgba(0,188,212,.25);border-color:#00bcd4;color:#fff}
.drop b{color:#fff}
.oname{padding:8px 12px;border-radius:8px;border:1px solid #607d8b;font-size:14px;width:180px}
.tabs{margin-top:12px;display:none;gap:6px}
.tabs.show{display:flex}
.tab{background:#455a64;color:#cfd8dc;border:none;padding:8px 18px;border-radius:10px 10px 0 0;font-size:14px;cursor:pointer;font-weight:bold}
.tab.act{background:#f4f5f7;color:#222}
.bar{margin-top:0;display:none;gap:8px;flex-wrap:wrap;align-items:center;background:#455a64;padding:10px;border-radius:0 10px 10px 10px}
.bar.show{display:flex}
.btn{background:#546e7a;color:#fff;border:none;padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer}
.btn.on{background:#00bcd4;font-weight:bold}.btn.print{background:#43a047}.btn.reset{background:#8d6e63}
.btn.newload{background:#c62828}.btn.save{background:#f9a825;color:#222;font-weight:bold}
.btn.tgl{background:#37474f}.btn.tgl.act{background:#ff7043;font-weight:bold}
.brandsel{padding:6px 10px;border-radius:14px;border:none;font-size:13px;max-width:200px}
.legend{font-size:11px;opacity:.9;margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:2px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:18px}
.empty{padding:60px 20px;text-align:center;color:#90a4ae;font-size:14px;line-height:1.8}
.card{position:relative;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;flex-direction:column;border:2px solid transparent}
.card.t{border-color:#ef9a9a}.card.saved{border-color:#f9a825}
.lnk{text-decoration:none;color:inherit;display:flex;flex-direction:column;flex:1}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ctools{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:5px}
.ctools button{width:26px;height:26px;border-radius:50%;border:none;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ctools .save{background:#fff;color:#bbb}.ctools .save.on{background:#f9a825;color:#fff}
.ctools .hide{background:rgba(0,0,0,.55);color:#fff}.ctools .hide:hover{background:#e53935}
.imgwrap{position:relative;background:#fff;height:180px;display:flex;align-items:center;justify-content:center;padding:10px}
.imgwrap img{max-width:100%;max-height:100%;object-fit:contain}.noimg{color:#bbb;font-size:13px}
img.pimg{cursor:grab}img.pimg:active{cursor:grabbing}
.mbadge{position:absolute;top:8px;left:8px;color:#333;font-weight:bold;font-size:13px;padding:3px 9px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:bold}
.chip.tasha{background:#ffcdd2;color:#c62828}.chip.setb{background:#fff3e0;color:#e65100}
.name{font-size:13px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand{font-size:11px;color:#888}
.jan{font-size:11px;color:#555;font-family:"SFMono-Regular",Consolas,monospace;background:#f5f5f5;padding:2px 6px;border-radius:5px;letter-spacing:.3px}.jan b{color:#222}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding-top:5px;border-top:1px solid #f0f0f0}
.price{font-size:14px;font-weight:bold;color:#00838f}.seller{font-size:10px;color:#aaa;text-align:right}
/* ===== 一覧表 / 保存リスト ===== */
.tblwrap{overflow-x:auto;padding:18px}
.savedbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
table.cat{border-collapse:collapse;width:100%;font-size:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
table.cat th{position:sticky;top:0;background:#37474f;color:#fff;padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;z-index:2}
table.cat th:hover{background:#455a64}
table.cat th .ar{opacity:.5;font-size:10px;margin-left:3px}
table.cat th.sorted{background:#00838f}table.cat th.sorted .ar{opacity:1}
table.cat td{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.08);vertical-align:middle}
tr.trow:hover td{filter:brightness(.96)}
.tthumb{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:4px}
.tname{max-width:320px;white-space:normal;line-height:1.3}
.tname a{color:#0d47a1;text-decoration:none}.tname a:hover{text-decoration:underline}
.tnum{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tmonth{font-weight:bold;text-align:center}
.tjan{font-family:"SFMono-Regular",Consolas,monospace;color:#333;white-space:nowrap}
.tchip{font-size:9px;padding:1px 5px;border-radius:6px;font-weight:bold;margin-left:4px}
.tchip.tasha{background:#ffcdd2;color:#c62828}.tchip.setb{background:#fff3e0;color:#e65100}
.tact{white-space:nowrap;text-align:center}
.tsave{cursor:pointer;color:#cfcfcf;font-size:16px}.tsave.on{color:#f9a825}
.txhide,.tdel{cursor:pointer;color:#b0bec5;font-weight:bold}.txhide:hover,.tdel:hover{color:#e53935}
.brandhead td{background:#eceff1!important;font-weight:bold;color:#37474f;font-size:12px}
.brandhead{cursor:pointer}.brandhead .fold{display:inline-block;width:14px;color:#78909c}
.makertabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mtab{background:#e2e8ee;border:1px solid #cfd8dc;border-radius:16px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.mtab:hover{background:#d3dde6}
.mtab.on{background:#00838f;color:#fff;border-color:#00838f;font-weight:bold}
.mtab .cnt{opacity:.7;font-size:11px;margin-left:4px}
td .ed{width:100%;box-sizing:border-box;border:1px solid #cfd8dc;border-radius:4px;padding:3px 5px;font:inherit;background:#fffef7}
td .ed:focus{outline:none;border-color:#00838f;background:#fff}
td textarea.ed{resize:vertical;min-height:26px;line-height:1.4}
.memocol{width:150px}
.srcbanner{display:flex;align-items:center;gap:12px;background:#fff3e0;border-bottom:1px solid #ffb74d;padding:9px 18px;font-size:13px;color:#e65100;font-weight:bold;flex-wrap:wrap}
.srcbanner .btn{background:#8d6e63}
.cardmemowrap{padding:0 12px 10px}
.cardmemowrap textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8dc;border-radius:5px;padding:4px 6px;font:inherit;background:#fffef7;resize:vertical;min-height:30px}
.cardmemowrap textarea:focus{outline:none;border-color:#00838f;background:#fff}
@page{margin:8mm 7mm}
@media print{
 header,.ctools,.txhide,.tsave,.tdel,.tact,.savedbar,.makertabs,#manualBar,.srcbanner{display:none!important}body{background:#fff}
 .sellercol,.seller,.cartcol,.price,.memocol,.cardmemowrap,.mlabel{display:none!important}
 td .ed{border-color:transparent!important;background:transparent!important}
 .grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:0}
 .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}.imgwrap{height:150px}.card:hover{box-shadow:none}
 .tblwrap{padding:0;overflow:visible}table.cat{box-shadow:none;font-size:10px}
 table.cat th{color:#000;background:#eee!important}tr.trow{break-inside:avoid}
 .empty{display:none}
}
</style></head><body>
<header>
<h1>カタログ仕上げ <span id="cnt" style="opacity:.7;font-weight:normal"></span></h1>
<div class="sub">Keepaエクスポート(xlsx)を下にドロップ → 月販50以上を「カード」＆「一覧表」で表示 / ★で保存リストに蓄積 / 重複集約 / Amazon本体除外</div>
<div class="setup">
 <label class="drop" id="drop">📄 ここに <b>Keepa の xlsx</b> をドラッグ＆ドロップ（またはクリックして選択）
  <input type="file" id="file" accept=".xlsx" style="display:none">
 </label>
 <input class="oname" id="oname" placeholder="卸名（任意）" value="">
</div>
<div class="tabs" id="tabs">
 <button class="tab act" id="tabCard" onclick="setView('card')">🖼 カード</button>
 <button class="tab" id="tabTable" onclick="setView('table')">📋 一覧表（並べ替え）</button>
 <button class="tab" id="tabSaved" onclick="setView('saved')">⭐ 保存リスト</button>
</div>
<div class="bar" id="bar">
<button class="btn on" onclick="flt(this,'all')">すべて</button>
<button class="btn" onclick="flt(this,'jisha')">自社のみ</button>
<button class="btn" onclick="flt(this,'tasha')">他社のみ</button>
<select class="brandsel" id="brandSel" onchange="refresh()"><option value="">全ブランド</option></select>
<button class="btn tgl" onclick="toggle('nb',this)">ノーブランド品を隠す</button>
<button class="btn tgl" onclick="toggle('set',this)">セット/複数売りを隠す</button>
<button class="btn save" onclick="saveVisible()">★ 表示中を保存リストへ</button>
<button class="btn print" onclick="window.print()">🖨 印刷 / PDF保存</button>
<button class="btn reset" onclick="resetHidden()">非表示を戻す</button>
<button class="btn newload" onclick="resetAll()">🔄 リセット（新規読込）</button>
<input id="barCode" class="brandsel" style="width:150px" placeholder="ASIN/JANで取り込み" onkeydown="if(event.key==='Enter'){event.preventDefault();importFromBar();}">
<button class="btn save" onclick="importFromBar()">＋取り込み</button>
<span class="legend">月販:
<span><span class="dot" style="background:#e53935"></span>1000+</span>
<span><span class="dot" style="background:#fb8c00"></span>500+</span>
<span><span class="dot" style="background:#fbb74d"></span>200+</span>
<span><span class="dot" style="background:#ffd54f"></span>100+</span>
<span><span class="dot" style="background:#fff176"></span>50+</span>
<span style="margin-left:6px">赤枠=他社 / 橙枠=保存済</span></span>
</div></header>

<div class="srcbanner" id="srcBanner" style="display:none">
 <span class="bt"></span>
 <button class="btn" onclick="backToFile()">← 読み込んだファイルに戻る</button>
</div>

<div class="grid" id="g">
 <div class="empty" id="empty">まだデータがありません。<br>上の枠に Keepa の xlsx をドロップしてください。</div>
</div>

<div class="tblwrap" id="tblwrap" style="display:none">
 <table class="cat" id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<div class="tblwrap" id="savedwrap" style="display:none">
 <div class="savedbar">
   <b id="savedCount">保存 0 件</b>
   <button class="btn" onclick="openSavedIn('card')">🖼 カードで開く</button>
   <button class="btn" onclick="openSavedIn('table')">📋 一覧表で開く</button>
   <button class="btn print" onclick="window.print()">🖨 印刷 / PDF</button>
   <button class="btn save" onclick="exportSavedCSV()">⬇ CSVで書き出す</button>
   <button class="btn reset" onclick="clearSaved()">🗑 保存を全消去</button>
 </div>
 <div class="makertabs" id="makerTabs"></div>
 <div id="manualBar" style="margin:2px 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
   <input id="codeInput" class="oname" style="width:210px" placeholder="ASIN(10桁) か JAN を入力" onkeydown="if(event.key==='Enter'){event.preventDefault();importByCode();}">
   <button class="btn save" onclick="importByCode()">＋ 取り込む</button>
   <button class="btn" onclick="addManualToMaker()">空の行を追加</button>
   <span style="font-size:11px;color:#78909c">ASINなら画像とAmazonリンクを自動取得。商品名などは各行で編集できます（★でカタログからも追加可）。</span>
 </div>
 <table class="cat" id="savedtbl"><thead id="savedhead"></thead><tbody id="savedbody"></tbody></table>
</div>

<script>
// ===== 他社ブランド判定キーワード（卸ごとに調整可）=====
const TASHA_KEYWORDS = ['コタ','COTA','KOTA','滝川','クレ・ド・ポー','clé de peau',
                        'テクノエイト','小林工房','中央有機化学','ユーカリジャパン'];
const SET_RE = /[×xＸ]\s*\d+\s*(個|本|セット|パック)|\d+\s*(個|本)\s*セット|まとめ買い|\d+\s*個\s*入/;
const SAVED_KEY='catalog_saved_v1';   // 保存リストは全ファイル共通で蓄積

let KEY='catalog_hidden_50';
let curMode='all',hideNb=false,hideSet=false,view='card',brandFilter='';
let sortKey='tsuki',sortDir='desc';
let savedMakerFilter='';           // 選択中のメーカータブ（''=全部）
let collapsedMakers={};            // 折りたたみ中のメーカー
let srcMode='file';                // カード/一覧表の表示元 'file'=読込ファイル / 'saved'=保存リスト
let srcMaker='';                   // saved表示時のメーカー（''=全メーカー）
let ALL=[];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=x=>typeof x==='number'&&isFinite(x);
const num=x=>isNum(x)?x:(x!=null&&x!==''&&!isNaN(x)?parseFloat(x):null);
const isTasha=b=>TASHA_KEYWORDS.some(k=>String(b||'').includes(k));
const isSet=n=>SET_RE.test(String(n||''));
const isNobrand=b=>['ノーブランド品','不明',''].includes(String(b||''));
// メーカー名の表記ゆれを吸収（例: サンコール(SUNCALL)→サンコール）
const normMaker=s=>{const t=String(s||'').replace(/[（(][^（）()]*[）)]/g,'').trim();return t||String(s||'').trim()||'(メーカー不明)';};
const tierColor=t=>t>=1000?'#e53935':t>=500?'#fb8c00':t>=200?'#fbb74d':t>=100?'#ffd54f':'#fff176';
const rowTint =t=>t>=1000?'#ef9a9a':t>=500?'#ffcc80':t>=200?'#ffe0b2':t>=100?'#fff59d':'#fff9c4';
const yen=v=>isNum(v)?'¥'+Math.round(v).toLocaleString('ja-JP'):'—';
// Keepaの「出品者名 (評価%) / 出品者ID」を「出品者名 評価%%」に整形（%はカート取得率ではなく店舗評価）
function sellerDisp(raw){
  raw=String(raw||'').trim();
  if(!raw||raw==='-') return raw||'';
  const m=raw.match(/^(.*?)\s*\((\d+)%\)/);
  if(m) return m[1].trim()+' 評価'+m[2]+'%';
  return raw.split(' / ')[0].trim();
}

// ASIN列がフルURL（https://…/dp/XXXXXXXXXX）でもASIN10桁を取り出す
function extractAsin(v){
  const s=String(v==null?'':v).trim();
  const m=s.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})/i)||s.match(/^([A-Z0-9]{10})$/i);
  return m?m[1].toUpperCase():s;
}
const IMG_BY_ASIN=a=>a?'https://images-na.ssl-images-amazon.com/images/P/'+a+'.jpg':'';
// ASIN由来画像が無い場合Amazonは1x1画像を返す→「画像なし」に置換
function imgCheck(im){
  if(im.naturalWidth>1) return;
  if(im.classList.contains('tthumb')){ im.style.visibility='hidden'; }
  else { const d=document.createElement('div'); d.className='noimg'; d.textContent='画像なし'; im.replaceWith(d); }
}

function processRows(rows){
  const hdr=rows[0].map(v=>v==null?'':String(v));
  const find=names=>{ for(const n of names){ const i=hdr.indexOf(n); if(i>=0) return i; } return -1; };
  // 生Keepaエクスポートと、仕上げ済み9列カラー形式の両方に対応（列名は複数候補で照合）
  const MAP={
    img:['画像'], name:['商品名'], rank:['売れ筋ランキング: 現在価格','売れ筋ランキング'],
    asin:['ASIN'], ean:['商品コード: EAN','商品コード: UPC','JAN'], brand:['ブランド'], maker:['製造者'],
    bb:['Buy Box: Buy Box セラー','Buy Boxセラー','販売者'], bbp:['Buy Box: 現在価格','Buy Box:現在価格','相場'],
    tsuki:['月間売上トレンド: 先月の購入','先月の購入(月販)','先月の購入','月販']
  };
  const I={}; for(const k in MAP) I[k]=find(MAP[k]);
  if(I.name<0||I.asin<0||I.tsuki<0)
    throw new Error('必要な列が見つかりません（商品名・ASIN・先月の購入(月販)）。KeepaエクスポートのxlsxはOKです。');
  const g=(row,k)=> I[k]>=0 ? row[I[k]] : null;
  const groups={},noean=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||row.length===0) continue;
    const e=g(row,'ean');
    if(e!=null&&e!==''){const key=String(e).split(',')[0];(groups[key]=groups[key]||[]).push(row);}
    else noean.push(row);
  }
  const score=r=>[-(num(g(r,'tsuki'))??-1), g(r,'bb')==='Amazon'?1:0, num(g(r,'rank'))??9e9];
  const cmp=(a,b)=>{const x=score(a),y=score(b);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]-y[i];}return 0;};
  let kept=[];
  for(const k in groups){kept.push(groups[k].slice().sort(cmp)[0]);}
  kept=kept.concat(noean);
  const data=[];
  for(const r of kept){
    if(g(r,'bb')==='Amazon') continue;            // Amazon本体除外
    const t=num(g(r,'tsuki'));
    if(t==null||t<50) continue;                   // 月販50以上のみ
    const brand=String(g(r,'brand')||'');
    const asin=extractAsin(g(r,'asin'));
    const rawImg=String(g(r,'img')||'').split(';')[0].trim();
    const img=rawImg||IMG_BY_ASIN(asin);          // 画像列が無ければASINから生成
    data.push({img:img,name:String(g(r,'name')||''),
      brand:brand,maker:String(g(r,'maker')||''),asin:asin,
      ean:String(g(r,'ean')||'').split(',')[0].trim(),tsuki:t,rank:num(g(r,'rank')),bbp:num(g(r,'bbp')),
      seller:String(g(r,'bb')||''),tasha:isTasha(brand),
      nobrand:isNobrand(brand),set:isSet(String(g(r,'name')||''))});
  }
  return data;
}

// ===== 保存リスト（localStorage・全ファイル共通で蓄積）=====
function getSaved(){try{return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]')}catch(e){return[]}}
function setSaved(a){try{localStorage.setItem(SAVED_KEY,JSON.stringify(a))}catch(e){}}
function savedHas(asin){return getSaved().some(x=>x.asin===asin);}
const idOf=d=>d._id||d.asin||'';
function saveOne(asin){
  const d=ALL.find(x=>x.asin===asin); if(!d)return false;
  const s=getSaved(); if(s.some(x=>x.asin===asin))return false;
  const oroshi=document.getElementById('oname').value.trim();
  s.push(Object.assign({},d,{_id:d.asin,_oroshi:oroshi,_savedAt:new Date().toISOString().slice(0,10),_maker:normMaker(d.maker),_memo:''}));
  setSaved(s); return true;
}
function unsaveOne(asin){setSaved(getSaved().filter(x=>x.asin!==asin));}
// メモ等の編集を保存（idで対象特定）
function editSaved(id,field,value){
  const s=getSaved();const it=s.find(x=>idOf(x)===id);if(!it)return;
  it[field]=value; if(field==='maker')it._maker=normMaker(value); setSaved(s);
}
function delById(e,id){e.preventDefault();e.stopPropagation();setSaved(getSaved().filter(x=>idOf(x)!==id));refresh();}
// 手入力の空アイテムの雛形
function blankManual(maker){
  return {_id:'m'+Date.now()+'_'+Math.floor(Math.random()*10000),_manual:true,_maker:maker,maker:(maker==='(手入力)'?'':maker),brand:'',
    name:'',ean:'',asin:'',img:'',tsuki:0,bbp:null,seller:'',_oroshi:'手入力',
    _savedAt:new Date().toISOString().slice(0,10),_memo:''};
}
function addManualToMaker(){
  const m=savedMakerFilter||'(手入力)';
  const s=getSaved(); s.push(blankManual(m)); setSaved(s); refresh();
}
// ASIN/JAN を保存リストに取り込む共通処理（ASINは画像＋Amazonリンクを自動付与）
function importCode(raw){
  const code=(raw||'').trim().replace(/\s/g,'').toUpperCase();
  if(!code) return false;
  const m=savedMakerFilter||'(手入力)';
  const item=blankManual(m);
  if(/^[A-Z0-9]{10}$/.test(code)){                 // ASIN（英数字10桁・ISBN含む）
    item.asin=code; item.img='https://images-na.ssl-images-amazon.com/images/P/'+code+'.jpg';
  } else if(/^\d{8}$|^\d{12}$|^\d{13}$/.test(code)){ // JAN/UPC/EAN
    item.ean=code;
  } else {
    alert('ASIN（英数字10桁）か JAN（8・12・13桁の数字）を入力してください。\n入力: '+code); return false;
  }
  const s=getSaved(); s.push(item); setSaved(s); return true;
}

function visible(){
  if(srcMode==='saved'){                       // 保存リストをカード/一覧表で表示
    let d=getSaved().filter(x=>!srcMaker||savedMaker(x)===srcMaker);
    return sortData(d);
  }
  const h=getHidden();
  let d=ALL.filter(x=>{
    const modeok=(curMode==='all')||(curMode==='tasha'&&x.tasha)||(curMode==='jisha'&&!x.tasha);
    const brandok=!brandFilter||x.brand===brandFilter;
    return modeok&&brandok&&!h.includes(x.asin)&&!(hideNb&&x.nobrand)&&!(hideSet&&x.set);
  });
  return sortData(d);
}
function sortData(d){
  const numKeys={tsuki:1,rank:1,bbp:1};
  return d.slice().sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(numKeys[sortKey]){
      const nx=isNum(x),ny=isNum(y);
      if(!nx&&!ny)return 0; if(!nx)return 1; if(!ny)return -1;
      return sortDir==='asc'?x-y:y-x;
    }
    x=String(x||'');y=String(y||'');
    return sortDir==='asc'?x.localeCompare(y,'ja'):y.localeCompare(x,'ja');
  });
}

function exportSavedCSV(){
  let s=getSaved(); if(!s.length){alert('保存リストが空です。');return;}
  const mf=savedMakerFilter;
  let rows=s.filter(x=>!mf||savedMaker(x)===mf);
  rows.sort((a,b)=>{const ma=savedMaker(a),mb=savedMaker(b);if(ma!==mb)return ma.localeCompare(mb,'ja');return (b.tsuki||0)-(a.tsuki||0);});
  const head=['メーカー','卸名','ブランド','製造者','商品名','JAN','ASIN','月販','カート価格','販売者','メモ','保存日'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  for(const d of rows) lines.push([savedMaker(d),d._oroshi,d.brand,d.maker,d.name,d.ean,d.asin,d.tsuki,(isNum(d.bbp)?d.bbp:''),d.seller,d._memo,d._savedAt].map(q).join(','));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='保存リスト_'+(mf?mf+'_':'')+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

function handleFile(f){
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      if(!document.getElementById('oname').value.trim()){
        document.getElementById('oname').value=f.name.replace(/\.xlsx$/i,'').replace(/KeepaExport[-_ ]?/i,'').trim();
      }
      afterLoad(processRows(rows));
    }catch(err){alert('読み込みエラー: '+err.message);}
  };
  rd.readAsArrayBuffer(f);
}

document.addEventListener('dragstart', e=>{
  const im = e.target && e.target.closest ? e.target.closest('img.pimg') : null;
  if(!im) return;
  const url = im.dataset.img; if(!url) return;
  const dt = e.dataTransfer;
  try{ dt.clearData(); }catch(_){}
  dt.effectAllowed='copy';
  dt.setData('text/uri-list', url);
  dt.setData('text/plain', url);
  dt.setData('application/x-genaido-product', JSON.stringify({
    img:url, name:im.dataset.name||'', code:im.dataset.code||'', asin:im.dataset.asin||''}));
  dt.setData('DownloadURL','image/jpeg:'+((im.dataset.asin||'image')+'.jpg')+':'+url);
});

// 保存リストのメーカータブ／折りたたみ見出し
document.getElementById('makerTabs').addEventListener('click',e=>{const b=e.target.closest('.mtab');if(b)setMakerTab(b.dataset.maker||'');});
document.getElementById('savedbody').addEventListener('click',e=>{const h=e.target.closest('.brandhead');if(h)toggleFold(h.dataset.maker||'');});

// 起動時：保存リストがあればタブを見せる
updateTabs();
</script>
</body></html>
