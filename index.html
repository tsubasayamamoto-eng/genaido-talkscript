<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄愛堂 トークスクリプト（架電ナビ）</title>
<style>
  :root{
    --paper:#FBF9F4;
    --ink:#233044;
    --ink-soft:#5B6675;
    --indigo:#2E4374;
    --indigo-soft:#7488B9;
    --coral:#E26B43;
    --coral-bg:#FBE9E0;
    --say-bg:#EAF1FA;
    --say-ink:#2B4570;
    --branch-bg:#FBF3E0;
    --branch-ink:#8A6420;
    --green:#2F7A56;
    --green-bg:#E5F2EA;
    --red:#C0492F;
    --red-bg:#FBE6E1;
    --line:#E5DFD3;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--indigo);color:#fff;
    padding:12px 16px;display:flex;align-items:center;gap:12px;
    box-shadow:0 2px 8px rgba(35,48,68,.12);
  }
  .topbar .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .step-ind{flex:0 0 auto;font-size:12px;opacity:.92;background:rgba(255,255,255,.18);
    padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .iconbtn{
    flex:0 0 auto;background:rgba(255,255,255,.14);border:none;color:#fff;
    font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;
  }
  @media(max-width:400px){
    .topbar{gap:8px;padding:11px 12px;}
    .topbar .ttl{font-size:14px;}
    .topbar .step-ind{font-size:11px;padding:4px 8px;}
    .iconbtn{font-size:12px;padding:7px 9px;}
  }
  .iconbtn:active{background:rgba(255,255,255,.28);}

  /* Progress */
  .progress{height:5px;background:#dfe3ec;}
  .progress > i{display:block;height:100%;background:var(--coral);transition:width .25s ease;border-radius:0 3px 3px 0;}

  .screen{flex:1;padding:18px 16px 120px;}
  .hidden{display:none !important;}

  /* Headings inside step */
  .step-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;
    font-weight:700;font-size:15px;margin-right:10px;flex:0 0 auto;
  }
  .step-title{display:flex;align-items:center;margin:4px 0 2px;}
  .step-title h2{font-size:20px;margin:0;color:var(--indigo);font-weight:700;}
  .step-when{color:var(--ink-soft);font-size:13px;margin:0 0 16px 40px;}

  /* Say bubble — the main thing to read */
  .say{
    background:var(--say-bg);border-radius:16px;
    padding:16px 16px 16px 46px;position:relative;margin:12px 0;
    color:var(--say-ink);font-size:17px;line-height:1.85;
    border:1px solid #d4e0f1;
  }
  .say::before{content:"🗣";position:absolute;left:15px;top:14px;font-size:20px;
    transform-origin:center;animation:sayWiggle 1.8s ease-in-out infinite;}
  @keyframes sayWiggle{
    0%,55%,100%{transform:scale(1) rotate(0);}
    62%{transform:scale(1.22) rotate(-9deg);}
    70%{transform:scale(1.22) rotate(7deg);}
    78%{transform:scale(1.22) rotate(-5deg);}
    86%{transform:scale(1.12) rotate(0);}
  }
  .say .q{font-weight:700;color:var(--indigo);}
  .say .small{font-size:15px;color:var(--say-ink);display:block;margin-top:8px;font-weight:500;line-height:1.95;}

  .lead{font-size:13px;color:var(--ink-soft);font-weight:700;margin:18px 0 8px;}

  /* Branch buttons (relpy choices) */
  .choices{display:flex;flex-direction:column;gap:10px;margin:6px 0;}
  .choice{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:2px solid var(--indigo-soft);border-radius:14px;
    padding:14px 16px;font-size:15.5px;color:var(--ink);font-family:inherit;line-height:1.55;
    transition:transform .05s ease, box-shadow .15s ease;
  }
  .choice:active{transform:scale(.99);}
  .choice .bt{display:block;font-weight:700;font-size:15px;margin-bottom:2px;}
  .choice.go{border-color:var(--green);background:var(--green-bg);}
  .choice.go .bt{color:var(--green);}
  .choice.warn{border-color:var(--coral);}
  .choice.warn .bt{color:var(--coral);}
  .choice .arrow{float:right;color:var(--indigo-soft);font-weight:700;}

  /* Helper accordions: "if they ask..." */
  .helper{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
  .helper > summary{
    cursor:pointer;list-style:none;padding:11px 14px;font-size:14px;font-weight:700;
    color:var(--branch-ink);background:var(--branch-bg);display:flex;align-items:center;gap:8px;
  }
  .helper > summary::-webkit-details-marker{display:none;}
  .helper > summary::before{content:"❓";}
  .helper[open] > summary::before{content:"💬";}
  .helper .hbody{padding:12px 14px;font-size:14.5px;color:var(--ink);}

  /* Rebuttal cards */
  .rebuts{display:flex;flex-direction:column;gap:8px;margin:8px 0;}
  .rebut{background:var(--branch-bg);border-radius:12px;padding:11px 14px;font-size:14px;color:#6f4f12;}
  .rebut b{display:block;color:#5a3f0e;margin-bottom:3px;}
  .rebut .rebut-note{display:block;font-size:12.5px;color:#8a7a52;font-weight:400;margin:0 0 5px;}
  .rebut .rebut-say{display:block;}
  .rebut .rebut-say::before{content:"🗣 ";}

  /* Memo / record fields */
  .field{margin:12px 0;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;border:2px solid var(--line);border-radius:11px;
    padding:11px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
    transition:border-color .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .field input:focus, .field textarea:focus{
    outline:none;border-color:var(--coral);
    box-shadow:0 0 0 3px rgba(226,107,67,.18);
    background:#FFFDFB;
  }
  .field label{transition:color .15s ease;}
  .field:focus-within label{color:var(--coral);}
  .field .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .field textarea{min-height:64px;resize:vertical;}
  .addbtn{display:inline-flex;align-items:center;gap:6px;margin:2px 0 4px;
    background:#fff;border:1.5px dashed var(--indigo-soft);color:var(--indigo);
    border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .addbtn:active{transform:scale(.98);}
  .repeat-row{display:flex;align-items:flex-end;gap:8px;}
  .repeat-row .field{flex:1;}
  .rmbtn{flex:0 0 auto;width:40px;height:44px;margin:0 0 12px;border:1.5px solid var(--line);
    background:#fff;color:var(--red);border-radius:10px;font-size:20px;font-weight:700;
    cursor:pointer;line-height:1;}
  .rmbtn:active{transform:scale(.92);background:var(--red-bg);}
  .dup-warn{background:var(--red-bg);border:1.5px solid var(--red);color:var(--red);
    border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin:2px 0 12px;line-height:1.65;}
  .dup-warn b{color:var(--red);}
  .dup-warn.caution{background:var(--branch-bg);border-color:#C9B79A;color:var(--branch-ink);}
  .dup-warn.caution b{color:#6f4f12;}

  /* 飽きさせない演出：入場アニメ＋ホバー */
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  @keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
  .step-title{animation:fadeUp .3s ease both;}
  .step-when{animation:fadeUp .34s ease both;}
  .say{animation:fadeUp .38s ease both;}
  .step-art{animation:popIn .45s ease both;}
  .choices .choice{animation:fadeUp .4s ease both;}
  @media(hover:hover){
    .choice,.mode-card,.mailbtn,.minibtn{transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease;}
    .choice:hover,.mode-card:hover,.mailbtn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(35,48,68,.12);}
    .month-head:hover{filter:brightness(1.08);}
    .donebtn:hover{border-color:var(--green);color:var(--green);}
    .copybtn:hover,.btn:hover{filter:brightness(1.05);}
    .rmbtn:hover{background:var(--red-bg);}
  }
  @media(prefers-reduced-motion:reduce){
    .step-title,.step-when,.say,.step-art,.choices .choice,.say::before{animation:none;}
  }

  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;}
  .panel h3{margin:0 0 4px;font-size:15px;color:var(--coral);}
  .panel.indigo h3{color:var(--indigo);}
  .panel .ph{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}

  .selfinfo{
    background:var(--green-bg);border-radius:12px;padding:12px 14px;margin:12px 0;
    font-size:15px;color:#21603f;border:1px solid #cfe6d8;
  }
  .selfinfo b{color:var(--green);}
  .selfinfo .copy{margin-left:6px;font-size:12px;background:var(--green);color:#fff;border:none;
    padding:3px 9px;border-radius:8px;cursor:pointer;font-weight:700;}

  .checklist{list-style:none;padding:0;margin:6px 0 0;}
  .checklist li{position:relative;padding:7px 0 7px 28px;font-size:14.5px;border-bottom:1px dashed var(--line);}
  .checklist li:last-child{border-bottom:none;}
  .checklist li::before{content:"✓";position:absolute;left:4px;top:7px;color:var(--green);font-weight:700;}

  /* Bottom action bar */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(180deg, rgba(251,249,244,0) 0%, var(--paper) 28%);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .actionbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;}
  .btn{
    flex:1;border:none;border-radius:14px;padding:16px 18px;font-size:16.5px;font-weight:700;
    cursor:pointer;font-family:inherit;line-height:1.3;
  }
  .btn:active{transform:scale(.99);}
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 12px rgba(226,107,67,.32);}
  .btn-green{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(47,122,86,.3);}
  .btn-ghost{flex:0 0 auto;background:#fff;border:2px solid var(--line);color:var(--ink-soft);}

  /* Home */
  .home-hero{
    background:var(--indigo);color:#fff;border-radius:20px;padding:22px 20px;margin:8px 0 18px;
  }
  .home-hero .eyebrow{font-size:11px;letter-spacing:.18em;color:#FFD9C8;font-weight:700;margin:0 0 6px;}
  .home-hero h1{font-size:23px;margin:0 0 4px;font-weight:700;}
  .home-hero p{margin:6px 0 0;font-size:13.5px;color:#E7ECF6;line-height:1.7;}
  .start-btn{
    width:100%;margin-top:16px;background:var(--coral);color:#fff;border:none;border-radius:14px;
    padding:18px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(226,107,67,.4);
  }
  .start-btn:active{transform:scale(.99);}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;}
  .sec-head h3{font-size:15px;margin:0;color:var(--indigo);}
  .sec-head .tools{display:flex;gap:8px;}
  .minibtn{font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:6px 11px;border-radius:9px;cursor:pointer;}
  .minibtn:active{background:#f0ede6;}

  .rec{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;
  }
  .rec-top{display:flex;align-items:center;gap:12px;}
  .mailbtn{width:100%;margin-top:11px;background:var(--say-bg);border:1.5px solid var(--indigo-soft);
    color:var(--indigo);border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .mailbtn:active{transform:scale(.99);}
  .rec .recmain{flex:1;min-width:0;}
  .rec .recco{font-weight:700;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec .recsub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge.成立{background:var(--green-bg);color:var(--green);}
  .badge.見送り{background:#EEE;color:#777;}
  .badge.担当不在{background:var(--branch-bg);color:var(--branch-ink);}
  .badge.受付拒否{background:var(--red-bg);color:var(--red);}
  .badge.卸紹介{background:var(--say-bg);color:var(--indigo);}
  .badge.再架電{background:#E7EEF6;color:#3A5A8C;}
  .badge.途中終了{background:#EEE;color:#777;}
  .rec .del{background:none;border:none;color:#c9bda7;font-size:20px;cursor:pointer;padding:2px 4px;line-height:1;}
  .rec .recmain{cursor:pointer;border-radius:8px;}
  .rec .recmain:active{opacity:.6;}
  .recco .go-detail{color:var(--indigo-soft);font-weight:700;margin-left:4px;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:24px 10px;}

  /* Month folders */
  .list-hint{font-size:12px;color:var(--ink-soft);margin:0 4px 12px;}
  .month-folder{margin:0 0 16px;}
  .month-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--indigo);color:#fff;border:none;border-radius:12px;padding:11px 15px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;}
  .month-head:active{filter:brightness(1.1);}
  .month-head .mh-right{font-size:12.5px;font-weight:700;opacity:.92;display:flex;align-items:center;gap:8px;}
  .mh-caret{transition:transform .2s ease;display:inline-block;}
  .month-folder.collapsed .month-body{display:none;}
  .month-folder.collapsed .mh-caret{transform:rotate(-90deg);}

  /* Quick chips on a record */
  .rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;}
  .chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .chip-dist{background:var(--branch-bg);color:var(--branch-ink);border:1px solid #e6d6b0;}
  .chip-mail{background:var(--green-bg);color:var(--green);}
  .chip-form{background:var(--say-bg);color:var(--indigo);}
  .chip-note{background:#F0EDE6;color:var(--ink-soft);}
  .chip-sent{background:var(--green);color:#fff;}
  .mail-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;font-size:13px;}
  .ms-badge{font-weight:700;padding:5px 12px;border-radius:999px;}
  .ms-badge.sent{background:var(--green-bg);color:var(--green);}
  .ms-badge.unsent{background:#F0EDE6;color:var(--ink-soft);}
  .mini-toggle{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:8px;
    padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .mini-toggle:active{transform:scale(.97);}
  .dt-sent{background:var(--green-bg);color:var(--green);border:1px solid #cfe6d8;border-radius:10px;
    padding:9px 12px;font-weight:700;font-size:13.5px;margin:0 0 12px;}

  /* Detail modal */
  .detailmodal{max-height:90vh;overflow-y:auto;}
  .dt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .dt-head h3{margin:0;font-size:18px;color:var(--indigo);}
  .dt-time{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft);}
  .dt-flag{background:var(--branch-bg);color:var(--branch-ink);border:1px solid #e6d6b0;border-radius:11px;
    padding:11px 13px;font-size:13.5px;font-weight:700;margin:0 0 13px;line-height:1.7;}
  .dt-flag b{color:#6f4f12;font-size:14.5px;}
  .dt-sec{margin:0 0 13px;}
  .dt-sec-t{font-size:12.5px;font-weight:700;color:var(--indigo);margin:0 0 7px;
    border-bottom:1.5px solid var(--line);padding-bottom:5px;}
  .dt-prod{font-size:14.5px;padding:3px 0;color:var(--ink);}
  .dt-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .dt-row:last-child{border-bottom:none;}
  .dt-k{flex:0 0 100px;color:var(--ink-soft);font-size:12.5px;font-weight:700;}
  .dt-v{flex:1;word-break:break-all;color:var(--ink);}
  .dt-note{font-size:14px;white-space:pre-wrap;background:var(--paper);border-radius:9px;padding:11px;line-height:1.7;}

  /* 卸・商社リスト */
  .distlist-btn{width:100%;background:var(--branch-bg);border:1.5px solid #C9B79A;color:var(--branch-ink);
    border-radius:12px;padding:13px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
    margin:0 0 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;}
  .distlist-btn:active{transform:scale(.99);}
  .distmodal{max-height:90vh;overflow-y:auto;}
  .dist-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin-bottom:9px;}
  .dist-main{flex:1;min-width:0;}
  .dist-name{font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .dist-src{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .dist-call{flex:0 0 auto;background:var(--coral);color:#fff;border:none;border-radius:10px;
    padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .dist-call:active{transform:scale(.96);}
  .mini-flag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .mini-flag.done{background:var(--green-bg);color:var(--green);}
  .mini-flag.todo{background:var(--coral-bg);color:var(--coral);}

  /* 記録の編集 */
  .editmodal{max-height:90vh;overflow-y:auto;}
  .edit-sec-t{font-size:12.5px;font-weight:700;color:var(--indigo);margin:16px 0 4px;
    border-bottom:1.5px solid var(--line);padding-bottom:5px;}
  .rbtn.sel{border-color:var(--indigo);background:var(--say-bg);color:var(--indigo);
    box-shadow:inset 0 0 0 1.5px var(--indigo);}

  /* Result picker (abort / finish) */
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;}
  .result-grid.solo{grid-template-columns:1fr;}
  .rbtn{
    border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .rbtn:active{transform:scale(.99);}
  .rbtn.g{border-color:var(--green);color:var(--green);background:var(--green-bg);}
  .rbtn.r{border-color:var(--red);color:var(--red);background:var(--red-bg);}
  .rbtn.y{border-color:#C9B79A;color:var(--branch-ink);background:var(--branch-bg);}

  .modal-back{position:fixed;inset:0;background:rgba(35,48,68,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  .modal h3{margin:2px 0 4px;font-size:18px;color:var(--indigo);}
  .modal p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}

  /* Mail compose modal */
  .mailmodal{max-height:90vh;overflow-y:auto;}
  .mailfield{margin:0 0 13px;}
  .mailfield .mlabel{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .mailfield .mval{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    font-size:14.5px;word-break:break-all;color:var(--ink);}
  .mbody{width:100%;min-height:210px;border:1px solid var(--line);border-radius:9px;padding:11px;
    font-size:13px;font-family:inherit;line-height:1.7;background:#fff;resize:vertical;color:var(--ink);}
  .copybtn{margin-top:7px;background:var(--indigo);color:#fff;border:none;border-radius:9px;
    padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .copybtn:active{transform:scale(.97);}
  .maillink{display:block;width:100%;text-align:center;text-decoration:none;margin-top:10px;}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);

function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, mw=mp(2,32), result='';
  var words=[], bitLen=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length;
  var comp={};
  for(var cand=2; pc<64; cand++){
    if(!comp[cand]){
      for(var i=0;i<313;i+=cand){ comp[i]=cand; }
      hash[pc]=(mp(cand,0.5)*mw)|0;
      k[pc++]=(mp(cand,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(var i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8) return;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=((bitLen/mw)|0);
  words[words.length]=(bitLen);
  for(var j=0;j<words.length;){
    var w=words.slice(j,j+=16);
    var oh=hash;
    hash=hash.slice(0,8);
    for(var i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2];
      var a=hash[0], e=hash[4];
      var t1=hash[7]
        + (rr(e,6)^rr(e,11)^rr(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i]=i<16?w[i]:(
            w[i-16]
            + (rr(w15,7)^rr(w15,18)^(w15>>>3))
            + w[i-7]
            + (rr(w2,17)^rr(w2,19)^(w2>>>10))
          )|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(var i=0;i<8;i++){ hash[i]=(hash[i]+oh[i])|0; }
  }
  for(var i=0;i<8;i++){
    for(var j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}

    inp.value=''; inp.focus();

}

    createdAt: new Date().toISOString(),
    company:"", productSize:"", productRate:"",
    contactName:"", contactEmail:"", contactDept:"", contactPhone:"",
    sendRoute:"", formUrl:"", sendDate:"",
    result:"", note:"", mailSent:false, mailSentAt:null,
    referralMaker:"", referralContact:""
  };
  PRODUCT_BINDS.forEach(b=> c[b]="");

  return c;
}

/* 画面の流れ。id順ではなく next()で遷移 */
let stepStack = [];        // 戻る用の履歴
const TOTAL_STEPS = 6;     // 進捗バー用のだいたいの段階数
let curStepNo = 0;         // 進捗表示用

/* ===================== 保存まわり ===================== */
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveRecords(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function saveCurrent(result){
  cur.result = result;
  cur.finishedAt = new Date().toISOString();
  const list = loadRecords();
  list.unshift(cur);
  saveRecords(list);
}

/* ===================== 小道具 ===================== */
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600);
}
function syncInputs(){
  // 画面上の入力欄を cur に反映
  document.querySelectorAll('[data-bind]').forEach(el=>{
    cur[el.getAttribute('data-bind')] = el.value;
  });
}
function copyText(txt){
  navigator.clipboard?.writeText(txt).then(()=>toast("コピーしました"),()=>toast("コピーできませんでした"));
}

/* ===================== トップバー / 進捗 ===================== */
function setTop(title, stepNo){
  document.getElementById('topTitle').textContent = title;
  const ind = document.getElementById('stepInd');
  const left = document.getElementById('topLeftBtn');
  if(stepNo){
    ind.classList.remove('hidden');
    ind.textContent = "STEP " + stepNo + " / " + TOTAL_STEPS;
    document.getElementById('progressBar').style.width = Math.round(stepNo/TOTAL_STEPS*100)+"%";
    document.getElementById('progressWrap').classList.remove('hidden');
    left.textContent = "← 戻る";
  }else{
    ind.classList.add('hidden');
    document.getElementById('progressWrap').classList.add('hidden');
    left.textContent = "🏠 ホーム";
  }
  curStepNo = stepNo || 0;
}
function onTopLeft(){
  if(curStepNo>0 && stepStack.length>0){
    syncInputs();
    const prev = stepStack.pop();
    renderStep(prev, true);
  }else{
    goHome();
  }
}

/* ===================== アクションバー ===================== */
function setActions(buttons){
  const bar=document.getElementById('actionbar'), inner=document.getElementById('actionInner');
  if(!buttons || !buttons.length){ bar.classList.add('hidden'); inner.innerHTML=""; return; }
  bar.classList.remove('hidden');
  inner.innerHTML = buttons.map((b,i)=>
    `<button class="btn ${b.cls||'btn-primary'}" data-ai="${i}">${b.label}</button>`).join('');
  inner.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=> buttons[+btn.dataset.ai].onClick();
  });
}

/* ===================== 画面遷移 ===================== */
function go(stepId){
  syncInputs();
  if(curStepNo>0) stepStack.push(currentStepId);
  renderStep(stepId);
}
let currentStepId = null;
function renderStep(stepId, isBack){
  currentStepId = stepId;
  window.scrollTo(0,0);
  STEPS[stepId]();
}

/* ===================== 卸・商社リスト（紹介された仕入れ先） ===================== */
function collectDistributors(){
  const map = {}; // 正規化名 -> {name, sources:[{company,date,contactName,products}]}
  loadRecords().forEach(r=>{
    const products = PRODUCT_BINDS.map(b=>r[b]).concat([r.productName]).map(x=>(x||'').trim()).filter(Boolean);
    DIST_BINDS.map(b=>r[b]).concat([r.distributor]).forEach(d=>{
      const v=(d||'').trim(); if(!v) return;
      const key=normalizeCo(v);
      if(!map[key]) map[key]={name:v, sources:[]};
      map[key].sources.push({company:r.company||'（無名）', date:r.finishedAt||r.createdAt, contactName:(r.contactName||'').trim(), products});
    });
  });
  return Object.values(map);
}
function distCalled(distName){
  const k=normalizeCo(distName);
  return loadRecords().some(r=> normalizeCo(r.company)===k);
}

  const dists = collectDistributors();

  back.innerHTML=`<div class="modal distmodal">

    <p>架電で教えてもらった卸・商社の一覧です。ここから直接架電できます（このリストだけCSVにも出せます）。</p>
    ${dists.length?`<div style="text-align:right;margin:-6px 0 12px"><button class="minibtn" onclick="exportDistCSV()">⬇ この一覧をCSV出力</button></div>`:''}
    ${body}
    <button class="rbtn" style="width:100%;margin-top:12px" data-close="1">閉じる</button>
  </div>`;
  back.addEventListener('click', e=>{ if(e.target===back) back.remove(); });
  back.querySelector('[data-close]').onclick=()=> back.remove();
  back.querySelectorAll('.dist-call').forEach((btn,i)=>{
    btn.onclick=()=>{
      back.remove();
      const d=dists[i], s=d.sources[0];

function exportDistCSV(){
  const dists=collectDistributors();
  if(!dists.length){ toast('卸・商社の記録がありません'); return; }
  const head=['卸・商社名','紹介元','紹介日','架電状況'];
  const esc2=v=>{ v=String(v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v; };
  const rows=dists.map(d=>{
    const s=d.sources[0]; const t=new Date(s.date);
    const date=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`;
    const srcCompanies=d.sources.map(x=>x.company).join(' / ');
    const status=distCalled(d.name)?'架電済み':'未架電';
    return [d.name, srcCompanies, date, status].map(esc2).join(',');
  }).join('\r\n');
  const csv='﻿'+head.join(',')+'\r\n'+rows;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='玄愛堂_卸商社リスト_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('卸・商社リストをCSV出力しました');
}

/* ===================== 架電重複チェック（会社名） ===================== */
function normalizeCo(s){
  return (s||'').toLowerCase()
    .replace(/[\s　]/g,'')
    .replace(/(株式会社|有限会社|合同会社|合資会社|合名会社|（株）|\(株\)|（有）|\(有\)|㈱|㈲)/g,'');
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=Array.from({length:m+1},(_,i)=>i);
  for(let j=1;j<=n;j++){
    let prev=dp[0]; dp[0]=j;
    for(let i=1;i<=m;i++){
      const tmp=dp[i];
      dp[i]=Math.min(dp[i]+1, dp[i-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return dp[m];
}
function similarity(a,b){
  if(!a||!b) return null;
  if(a===b) return 'exact';
  // 片方がもう片方を含む（株式会社の有無・後ろの語の付け足し等）
  if((a.length>=3 && b.indexOf(a)>=0) || (b.length>=3 && a.indexOf(b)>=0)) return 'similar';
  // 軽微な打ち間違い（編集距離）
  const d=levenshtein(a,b), maxLen=Math.max(a.length,b.length);
  if(maxLen>=3 && d<=Math.max(1, Math.floor(maxLen*0.3))) return 'similar';
  return null;
}
function findDupCompany(name){
  const n = normalizeCo(name);
  if(n.length < 2) return null;
  const exact=[], similar=[];
  loadRecords().forEach(r=>{
    const s = similarity(n, normalizeCo(r.company));
    if(s==='exact') exact.push(r);
    else if(s==='similar') similar.push(r);
  });
  return (exact.length || similar.length) ? {exact, similar} : null;
}
function dupSummary(matches){
  const m = matches[0];
  const t = new Date(m.finishedAt||m.createdAt);
  const ts = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`;
  return `${ts}・${m.result||'記録あり'}` + (matches.length>1 ? ` ほか${matches.length-1}件` : '');
}

function checkDupCompany(val){
  const warn = document.getElementById('dupWarn');
  if(!warn) return;
  const res = findDupCompany(val);
  if(!res){ warn.className='dup-warn hidden'; warn.innerHTML=''; return; }
  if(res.exact.length){
    warn.className='dup-warn';
    warn.innerHTML = `⚠️ この会社は<b>過去に架電済み</b>です（${dupSummary(res.exact)}）。架電が重複していないかご確認ください。`;
  }else{
    warn.className='dup-warn caution';
    const names = res.similar.slice(0,3).map(r=>esc(r.company||'（無名）')).join('、');
    const more = res.similar.length>3 ? ` ほか${res.similar.length-3}件` : '';

/* 「＋追加」で増やせる入力グループ（最初は入力済みの数だけ表示／②以降は×で消せる） */
function fRepeat(o){
  const vals = o.binds.map(b=>(cur[b]||'').trim());
  let lastFilled = 0;
  vals.forEach((v,i)=>{ if(v) lastFilled = i; });
  const visible = Math.max(1, lastFilled+1);
  const fields = o.binds.map((b,i)=>{
    const hide = i >= visible ? ' hidden' : '';
    const rm = i>0 ? `<button type="button" class="rmbtn" onclick="repeatRemove(this)" title="この欄を消す">×</button>` : '';
    return `<div class="repeat-item${hide}"><div class="repeat-row">${fField({label:o.labelEach(i), bind:b, ph:o.ph?o.ph(i):''})}${rm}</div></div>`;
  }).join('');
  const btnHide = visible >= o.binds.length ? ' hidden' : '';
  return `<div class="repeat-group">${fields}
    <button type="button" class="addbtn${btnHide}" onclick="repeatAdd(this)">${o.addLabel}</button></div>`;
}
function repeatAdd(btn){
  const group = btn.closest('.repeat-group');
  const next = group.querySelector('.repeat-item.hidden');
  if(next){ next.classList.remove('hidden'); }
  if(!group.querySelector('.repeat-item.hidden')) btn.classList.add('hidden');
  const inp = next && next.querySelector('input,textarea');
  if(inp) inp.focus();
}
function repeatRemove(btn){
  const group = btn.closest('.repeat-group');
  const items = [...group.querySelectorAll('.repeat-item')];
  const inputs = items.map(it=> it.querySelector('input,textarea'));
  const visible = items.filter(it=> !it.classList.contains('hidden'));
  const lastVis = items.indexOf(visible[visible.length-1]);
  const p = items.indexOf(btn.closest('.repeat-item'));
  // 値を上に詰める
  for(let j=p; j<lastVis; j++){ inputs[j].value = inputs[j+1].value; }
  inputs[lastVis].value = '';
  items[lastVis].classList.add('hidden');
  const addb = group.querySelector('.addbtn');
  if(addb) addb.classList.remove('hidden');
  syncInputs();
  group.dispatchEvent(new Event('input',{bubbles:true})); // スクロール型の表示も更新
}

/* --- ナビ型：1ノードを描画 --- */
function naviRender(id){
  const n = NODES[id];
  setTop(n.title, n.no);
  let html = `<div class="step-title"><span class="step-num">${n.no}</span><h2>${n.h}</h2></div>
    <p class="step-when">${n.when}</p>` + n.body('navi');
  if(n.naviExtra) html += n.naviExtra();
  if(n.branchLead) html += `<p class="lead">${n.branchLead}</p>`;
  if(n.branches){
    html += `<div class="choices">` + n.branches.map((b,i)=>{
      const cls = b.style==='go' ? 'choice go' : b.style==='warn' ? 'choice warn' : 'choice';
      const arrow = b.goto ? '<span class="arrow">→</span>' : '';
      return `<button class="${cls}" data-bi="${i}"><span class="bt">${b.bt}</span>${b.desc} ${arrow}</button>`;
    }).join('') + `</div>`;
  }
  const screen = document.getElementById('screen');
  screen.innerHTML = html;
  if(n.branches){
    screen.querySelectorAll('.choices .choice').forEach(btn=>{
      const b = n.branches[+btn.dataset.bi];
      btn.onclick = ()=>{ if(b.goto){ go(b.goto); } else if(b.result){ syncInputs(); finishWith(b.result); } };
    });
  }
  setActions((n.naviActions||[]).map(a=>({
    label:a.label, cls:a.cls,
    onClick:()=>{
      if(a.go){ syncInputs(); go(a.go); }
      else if(a.finish){ syncInputs(); finishWith(a.finish); }
      else if(a.abort){ abortPicker(); }
      else if(a.back){ onTopLeft(); }
    }
  })));
}

/* --- スクロール型：全部を1ページに描画（中身は同じ body() を使用） --- */
function subBranchInfo(branches){
  return branches.map(b=>
    `<p class="subline"><b>${b.bt}</b> … ${b.desc}</p>`).join('');
}
/* チェック付きカードの枠 */
function sCard(numLabel, title, when, inner){
  return `<div class="scroll-step">
    <div class="sstep-head">
      <div class="step-title"><span class="step-num">${numLabel}</span><h2>${title}</h2></div>
      <button class="donebtn" onclick="toggleDone(this)" title="読んだらチェック">✓</button>
    </div>
    <p class="step-when">${when}</p>
    ${inner}
  </div>`;
}
/* チェック切り替え（色が変わる＋フラッシュ） */
function toggleDone(btn){
  const card = btn.closest('.scroll-step');
  const done = card.classList.toggle('done');
  if(done){ card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
}
function scrollNode(id){
  const n = NODES[id];
  let inner = n.body('scroll');
  if(n.branchLead) inner += `<p class="lead">${n.branchLead}</p>`;
  if(n.branches){
    inner += `<div class="choices">` + n.branches.map(b=>{
      const cls = b.style==='go' ? 'binfo go' : b.style==='warn' ? 'binfo warn' : 'binfo';
      let extra = '';
      const sub = b.goto && NODES[b.goto] && NODES[b.goto].isSub ? NODES[b.goto] : null;
      if(sub){
        extra = `<div class="subblock">${sub.body('scroll')}`
          + (sub.branchLead ? `<p class="subline" style="font-weight:700;color:var(--indigo)">${sub.branchLead}</p>` : '')
          + (sub.branches ? subBranchInfo(sub.branches) : '')
          + `</div>`;
      }
      return `<div class="${cls}"><span class="bt">${b.bt}</span>${b.desc}${extra}</div>`;
    }).join('') + `</div>`;
  }
  return sCard(n.no, n.h, n.when, inner);
}
